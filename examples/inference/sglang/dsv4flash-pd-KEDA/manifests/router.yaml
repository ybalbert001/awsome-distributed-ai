#
# SGLang model gateway (router) for DeepSeek-V4-Flash PD. It finds prefill and
# decode workers through Kubernetes service discovery: every pod matching
# --prefill-selector / --decode-selector that becomes Ready is added, a pod
# that goes away is removed. That is what makes KEDA scaling transparent to
# clients: KEDA changes a Deployment's replicas, the router follows.
#
# The router also exports its own Prometheus metrics on :29000. Nothing scrapes
# them by default: this pod has no prometheus.io/* annotations, so the ADOT
# sglang job skips it. Its end-to-end view of TTFT is what a client sees, which
# the engines cannot measure on their own in PD mode.
---
# Entry point: clients talk to dsv4flash-router:30080 (OpenAI-compatible);
# the router pairs a prefill and a decode worker per request.
apiVersion: v1
kind: Service
metadata:
  name: dsv4flash-router
spec:
  selector:
    app: dsv4flash-router
  ports:
  - name: http
    port: 30080
    targetPort: 30080
  type: ClusterIP
---
# The router watches pods in its own namespace through the Kubernetes API, so
# it needs read access to pods (get/list/watch — nothing else).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsv4flash-router
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dsv4flash-router
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dsv4flash-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dsv4flash-router
subjects:
- kind: ServiceAccount
  name: dsv4flash-router
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsv4flash-router
  labels:
    # Deliberately NOT `app: dsv4flash` — that label is the engine selector
    # the router itself discovers on, and it must never match its own pod.
    app: dsv4flash-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsv4flash-router
  template:
    metadata:
      labels:
        app: dsv4flash-router
        sglang-metrics: "true"    # matched by the ADOT collector's sglang scrape job
    spec:
      serviceAccountName: dsv4flash-router
      containers:
      - name: router
        image: lmsysorg/sgl-model-gateway:v0.3.2
        imagePullPolicy: IfNotPresent
        ports:
        # Named `api`, not `http`, so a scraper that selects the engines' `http`
        # port does not pick it up; the router's metrics live on `metrics`.
        - containerPort: 30080
          name: api
        - containerPort: 29000
          name: metrics
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 8Gi
        # Liveness is a bare TCP check, not /readiness: the router reports
        # not-ready whenever its backends are down, and we must not restart the
        # router for that — only when its own process has wedged.
        livenessProbe:
          tcpSocket:
            port: 30080
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        # /readiness turns green only once at least one prefill AND one decode
        # worker are registered and healthy.
        readinessProbe:
          httpGet:
            path: /readiness
            port: 30080
          initialDelaySeconds: 30
          periodSeconds: 10
        env:
        # Scope discovery to the namespace this stack is deployed in, matching
        # the namespace-scoped Role above (an all-namespace watch would need a
        # ClusterRole).
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        command:
        - python3
        - -m
        - sglang_router.launch_router
        args:
        - --host
        - "0.0.0.0"
        - --port
        - "30080"
        - --pd-disaggregation
        - --service-discovery
        - --service-discovery-namespace
        - $(POD_NAMESPACE)
        # ONE port for every discovered worker: the router dials
        # http://<podIP>:30000 for prefill and decode alike, so all engine pods
        # listen on 30000. (This is also why the engines stay on the pod
        # network — with hostNetwork two engines on one node would share an IP
        # and collide on this port.) The prefill bootstrap port is read from the
        # pod annotation sglang.ai/bootstrap-port.
        - --service-discovery-port
        - "30000"
        # Label selectors, one key=value per token.
        - --prefill-selector
        - app=dsv4flash
        - component=prefill
        - --decode-selector
        - app=dsv4flash
        - component=decode
        - --prefill-policy
        - cache_aware
        - --decode-policy
        - round_robin
        - --prometheus-host
        - "0.0.0.0"
        - --prometheus-port
        - "29000"
